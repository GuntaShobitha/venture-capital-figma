<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <defs>
    <linearGradient id="luma1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2e1a"/>
      <stop offset="100%" stop-color="#0d1f0d"/>
    </linearGradient>
    <radialGradient id="luma2" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="200" height="120" fill="url(#luma1)"/>
  <rect width="200" height="120" fill="url(#luma2)"/>
  <!-- Pulse line (heartbeat) -->
  <polyline points="30,65 50,65 60,45 70,85 80,55 90,75 100,65 120,65" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="120,65 140,65 150,50 160,80 170,60 180,65 200,65" stroke="#10b981" stroke-width="1" fill="none" opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Medical cross -->
  <rect x="88" y="20" width="24" height="24" rx="4" stroke="#34d399" stroke-width="1.2" fill="rgba(52,211,153,0.08)"/>
  <line x1="100" y1="26" x2="100" y2="38" stroke="#34d399" stroke-width="2" opacity="0.6"/>
  <line x1="94" y1="32" x2="106" y2="32" stroke="#34d399" stroke-width="2" opacity="0.6"/>
  <!-- Heart circle -->
  <circle cx="100" cy="65" r="22" stroke="#10b981" stroke-width="0.8" fill="none" opacity="0.15"/>
  <text x="100" y="115" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#34d399" opacity="0.3" letter-spacing="2">HEALTHCARE</text>
</svg>