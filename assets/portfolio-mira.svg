<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <defs>
    <linearGradient id="mira1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e2a1a"/>
      <stop offset="100%" stop-color="#1f1c0d"/>
    </linearGradient>
    <radialGradient id="mira2" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="200" height="120" fill="url(#mira1)"/>
  <rect width="200" height="120" fill="url(#mira2)"/>
  <!-- Diamond/gem shape -->
  <polygon points="100,25 130,50 100,95 70,50" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.4"/>
  <polygon points="100,35 120,50 100,85 80,50" stroke="#fbbf24" stroke-width="1" fill="rgba(251,191,36,0.06)"/>
  <line x1="100" y1="25" x2="100" y2="95" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>
  <line x1="70" y1="50" x2="130" y2="50" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>
  <!-- Sparkle dots -->
  <circle cx="100" cy="50" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="85" cy="38" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="115" cy="38" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="100" cy="70" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <!-- Decorative rings -->
  <circle cx="100" cy="50" r="35" stroke="#f59e0b" stroke-width="0.5" fill="none" opacity="0.1"/>
  <circle cx="100" cy="50" r="45" stroke="#f59e0b" stroke-width="0.4" fill="none" opacity="0.07"/>
  <text x="100" y="115" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#fbbf24" opacity="0.3" letter-spacing="2">COMMERCE</text>
