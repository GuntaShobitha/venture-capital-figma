<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <linearGradient id="nova1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0d0d2b"/>
    </linearGradient>
    <radialGradient id="nova2" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="nova3" cx="70%" cy="60%" r="30%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="400" height="260" fill="url(#nova1)"/>
  <rect width="400" height="260" fill="url(#nova2)"/>
  <rect width="400" height="260" fill="url(#nova3)"/>
  <!-- Neural network nodes -->
  <circle cx="80" cy="80" r="4" fill="#818cf8" opacity="0.8"/>
  <circle cx="80" cy="130" r="4" fill="#818cf8" opacity="0.8"/>
  <circle cx="80" cy="180" r="4" fill="#818cf8" opacity="0.8"/>
  <circle cx="160" cy="60" r="5" fill="#a78bfa" opacity="0.9"/>
  <circle cx="160" cy="110" r="5" fill="#a78bfa" opacity="0.9"/>
  <circle cx="160" cy="160" r="5" fill="#a78bfa" opacity="0.9"/>
  <circle cx="160" cy="210" r="5" fill="#a78bfa" opacity="0.9"/>
  <circle cx="240" cy="90" r="6" fill="#c4b5fd" opacity="0.9"/>
