  <circle cx="320" cy="120" r="8" fill="#e0e7ff" opacity="0.9"/>
  <!-- Connections -->
  <line x1="80" y1="80" x2="160" y2="60" stroke="#818cf8" stroke-width="0.8" opacity="0.4"/>
  <line x1="80" y1="80" x2="160" y2="110" stroke="#818cf8" stroke-width="0.8" opacity="0.4"/>
  <line x1="80" y1="130" x2="160" y2="110" stroke="#818cf8" stroke-width="0.8" opacity="0.4"/>
  <line x1="80" y1="130" x2="160" y2="160" stroke="#818cf8" stroke-width="0.8" opacity="0.4"/>
  <line x1="80" y1="180" x2="160" y2="160" stroke="#818cf8" stroke-width="0.8" opacity="0.4"/>
  <line x1="80" y1="180" x2="160" y2="210" stroke="#818cf8" stroke-width="0.8" opacity="0.4"/>
  <line x1="160" y1="60" x2="240" y2="90" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
  <line x1="160" y1="110" x2="240" y2="90" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
  <line x1="160" y1="110" x2="240" y2="150" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
  <line x1="160" y1="160" x2="240" y2="150" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
  <line x1="160" y1="210" x2="240" y2="150" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
  <line x1="240" y1="90" x2="320" y2="120" stroke="#c4b5fd" stroke-width="1.2" opacity="0.6"/>
  <line x1="240" y1="150" x2="320" y2="120" stroke="#c4b5fd" stroke-width="1.2" opacity="0.6"/>
